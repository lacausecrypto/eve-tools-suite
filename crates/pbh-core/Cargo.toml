[package]
name = "pbh-core"
version = "0.1.0"
description = "Intel engine for Pirate's Big Helper — EVE Online local-chat threat analysis"
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `test-util` enables tokio's paused virtual clock for deterministic rate-limit tests.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }

[features]
default = []
# Enables tests that hit the live ESI / zKillboard APIs (run with: cargo test --features live-tests -- --ignored)
live-tests = []
