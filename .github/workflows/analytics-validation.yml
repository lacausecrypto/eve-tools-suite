name: Analytics validation
on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/analytics/**"
      - "src/App.tsx"
      - ".github/workflows/analytics-validation.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
