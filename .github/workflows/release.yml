# Compile et publie une release (Windows + macOS Apple Silicon) avec les signatures
# de l’updater Tauri, et une signature macOS ad hoc gratuite, avec les
# artefacts d'auto-update (`latest.json` signé) ET des copies à **nom stable**
# pour des liens de téléchargement permanents (`releases/latest/download/...`).
# Déclenché en poussant un tag `vX.Y.Z`.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   TAURI_SIGNING_PRIVATE_KEY           clé PRIVÉE existante de l'updater (ne pas régénérer)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  mot de passe éventuel
#   POSTHOG_PERSONAL_KEY                Personal API Key (scope annotation:write)
#   POSTHOG_PROJECT_ID                  identifiant du projet PostHog
# Apple Developer/APPLE_CERTIFICATE non requis : macOS est signé ad hoc
# (« - » dans tauri.conf.json) et non notarisé. Gatekeeper demandera une
# autorisation explicite aux personnes qui installent le DMG téléchargé.
# (GITHUB_TOKEN est fourni automatiquement.)
#
# macOS Intel (x86_64) est volontairement absent (runners GitHub rares/lents).
# Pour le rajouter : remettre une entrée matrix `macos-13` + target x86_64.

name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check aligned release versions
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const pkg = require("./package.json");
          const lock = require("./package-lock.json");
          const tauri = require("./src-tauri/tauri.conf.json");
          const cargo = fs.readFileSync("./src-tauri/Cargo.toml", "utf8");
          if (!(pkg.version === lock.version && pkg.version === lock.packages[""].version &&
                pkg.version === tauri.version && cargo.includes('version = "' + pkg.version + '"'))) {
            process.exitCode = 1;
            console.error("Release versions do not match");
          }
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Frontend unit tests
        run: npm test
      - name: Production frontend build
        run: npm run build

  release:
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            stable: EVE-Tools-Suite-macOS-AppleSilicon.dmg
            find: "*.dmg"
          - platform: windows-latest
            target: ""
            args: ""
            stable: EVE-Tools-Suite-Windows-Setup.exe
            find: "*-setup.exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF" != "refs/tags/$tag" && "$GITHUB_REF" != "refs/heads/release/$tag" ]]; then
            echo "::error::Ref $GITHUB_REF does not match release $tag"
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Validate updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed updates"
            exit 1
          fi

      - name: Build, ad-hoc sign macOS and upload draft artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseCommitish: ${{ github.sha }}
          releaseName: "EVE Tools Suite ${{ env.RELEASE_TAG }}"
          releaseBody: |
            v0.1.5 introduces the smart notification center: configurable multi-condition alerts,
            threshold and crossing triggers, cooldowns, quick templates and local notification history.
            Alerts cover Trade, Market, Pirate, Loss, Appraisal, Industry, Skills, LP, Abyssal
            and Reprocessing. Hardened Tauri permissions, CSP and dependencies.
            Download the installer for your OS below. Existing installations
            can update automatically using cryptographically signed updater artifacts.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # L'identité ad hoc ne nécessite ni abonnement ni secret Apple.
      # Vérifier qu'un futur changement n'enlève pas silencieusement la signature.
      - name: Verify ad-hoc macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find target -type d -path '*/bundle/macos/*.app' -print -quit)
          if [ -z "$app" ]; then echo "::error::macOS .app not found"; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$app"
          details=$(codesign -dv --verbose=2 "$app" 2>&1)
          if ! grep -Fq 'Signature=adhoc' <<< "$details"; then
            echo "::error::Expected ad-hoc macOS signature"; exit 1
          fi
          echo "Verified ad-hoc signature: $app"

      # Copie l'installeur sous un nom STABLE (sans version) et l'attache à la
      # release → les boutons du README peuvent pointer en permanence sur
      # `releases/latest/download/<nom stable>` (zéro maintenance par version).
      - name: Attach stable-named installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          # Workspace Cargo (crates/pbh-core) → la sortie va dans `target/` à la
          # racine, PAS `src-tauri/target/`. `-print -quit` = 1er match sans SIGPIPE.
          src=$(find target -type f -name "${{ matrix.find }}" -print -quit)
          if [ -z "$src" ]; then
            echo "::error::installer introuvable (${{ matrix.find }})"; find target -type f \( -name '*.dmg' -o -name '*-setup.exe' \) 2>/dev/null; exit 1
          fi
          echo "installer: $src → ${{ matrix.stable }}"
          cp "$src" "${{ matrix.stable }}"
          gh release upload "${{ env.RELEASE_TAG }}" "${{ matrix.stable }}" --clobber --repo "$GITHUB_REPOSITORY"

  # Tous les builds OK → on publie le brouillon et on le marque « latest »
  # (sinon la release reste en draft et nécessite une publication manuelle).
  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          if [[ "$tag" != v* || "$tag" == *"/"* ]]; then
            echo "::error::Invalid release tag: $tag"; exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Verify both platforms and signed updater metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > release-assets.txt
          for pattern in \
            'EVE-Tools-Suite-Windows-Setup.exe' \
            'EVE-Tools-Suite-macOS-AppleSilicon.dmg' \
            'EVE.Tools.Suite_0.1.5_x64-setup.exe.sig' \
            'EVE.Tools.Suite_aarch64.app.tar.gz.sig' \
            'latest.json'; do
            if ! grep -Fxq "$pattern" release-assets.txt; then
              echo "::error::Missing release asset $pattern"; exit 1
            fi
          done
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP"
          node - "$RUNNER_TEMP/latest.json" "$tag" <<'NODE'
          const fs = require('fs');
          const json = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const tag = process.argv[3];
          if (json.version !== tag.slice(1)) throw Error('Unexpected updater version ' + json.version);
          const platforms = Object.entries(json.platforms || {});
          for (const name of ['windows-x86_64', 'darwin-aarch64']) {
            const matches = platforms.filter(([k]) => k === name || k.startsWith(name + '-'));
            if (!matches.length || !matches.some(([,v]) => typeof v.signature === 'string' && v.signature.length > 0 && typeof v.url === 'string' && v.url.includes('/' + tag + '/'))) {
              throw Error('Missing signed updater entry for ' + name);
            }
          }
          console.log('Both platforms and updater signatures verified:', platforms.map(([k]) => k).join(', '));
          NODE

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A preceding unsuccessful run may have created the draft from an older
          # commit. Align the final Git tag with this tested build before publishing.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag and .draft == true) | .id' | head -n 1)
          if [[ ! "$id" =~ ^[0-9]+$ ]]; then
            echo "::error::Draft release not found"; exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -f target_commitish="$GITHUB_SHA" \
            -F draft=false \
            -f make_latest=true |
            jq -e --arg sha "$GITHUB_SHA" '.draft == false and .target_commitish == $sha' >/dev/null

      - name: Annotate the release in PostHog
        env:
          POSTHOG_PERSONAL_KEY: ${{ secrets.POSTHOG_PERSONAL_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$POSTHOG_PERSONAL_KEY" ] || [ -z "$POSTHOG_PROJECT_ID" ]; then
            echo "skip: PostHog annotation secrets are not configured"
            exit 0
          fi
          payload=$(jq -n \
            --arg content "EVE Tools Suite release $TAG" \
            --arg date_marker "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{content:$content,date_marker:$date_marker,scope:"project",emoji:"🚀"}')
          curl --fail-with-body --silent --show-error \
            -X POST "https://eu.posthog.com/api/projects/$POSTHOG_PROJECT_ID/annotations/" \
            -H "Authorization: Bearer $POSTHOG_PERSONAL_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload"

      # Annonce la release sur Discord (embed propre). Le webhook est un SECRET
      # repo (`DISCORD_WEBHOOK`) — jamais en clair. Sans secret (forks), on skip.
      - name: Notify Discord (EN + FR)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_FR: ${{ secrets.DISCORD_WEBHOOK_FR }}
          TAG: ${{ env.RELEASE_TAG }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          dl="https://github.com/$REPO/releases/latest/download"
          site="https://eve-tools-suite.com"
          win="[⬇ Windows (.exe)]($dl/EVE-Tools-Suite-Windows-Setup.exe)"
          mac="[⬇ macOS (.dmg)]($dl/EVE-Tools-Suite-macOS-AppleSilicon.dmg)"
          dlv=$(printf '%s\n%s' "$win" "$mac")
          notes_en=$(gh release view "$TAG" --repo "$REPO" --json body -q .body | head -c 1500)
          notes_fr="Téléchargez l'installeur correspondant à votre OS ci-dessous. Une fois installée, l'app se met à jour automatiquement (mises à jour signées). Nouveautés détaillées sur le site."
          lkv_en="[Website]($site) · [Changelog]($site#changelog)"
          lkv_fr="[Site]($site) · [Nouveautés]($site#changelog)"
          # 1=webhook 2=desc 3=dlName 4=linksName 5=linksVal 6=footer
          post() {
            if [ -z "$1" ]; then echo "skip ($3): no webhook secret"; return 0; fi
            payload=$(jq -n \
              --arg title "🚀 EVE Tools Suite $TAG" \
              --arg url "https://github.com/$REPO/releases/tag/$TAG" \
              --arg desc "$2" --arg dln "$3" --arg dlv "$dlv" \
              --arg lkn "$4" --arg lkv "$5" --arg ft "$6" --arg av "$site/cube.png" \
              '{username:"EVE Tools Suite", avatar_url:$av,
                embeds:[{title:$title, url:$url, description:$desc, color:2854143,
                  thumbnail:{url:$av},
                  fields:[{name:$dln, value:$dlv}, {name:$lkn, value:$lkv}],
                  footer:{text:$ft}}]}')
            code=$(curl -sS -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "$payload" "$1")
            echo "$3 webhook → HTTP $code"
            case "$code" in 2*) : ;; *) echo "::warning::Discord ($3) returned $code" ;; esac
          }
          post "$DISCORD_WEBHOOK"    "$notes_en" "Download"    "Links" "$lkv_en" "Auto-updates if already installed"
          post "$DISCORD_WEBHOOK_FR" "$notes_fr" "Télécharger" "Liens" "$lkv_fr" "Mise à jour automatique si déjà installée"
