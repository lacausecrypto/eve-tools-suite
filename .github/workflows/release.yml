# Build, signe et publie une release (Windows + macOS Apple Silicon) avec les
# artefacts d'auto-update (`latest.json` signé) ET des copies à **nom stable**
# pour des liens de téléchargement permanents (`releases/latest/download/...`).
# Déclenché en poussant un tag `vX.Y.Z`.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   TAURI_SIGNING_PRIVATE_KEY           contenu de .tauri/eve-tools-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  mot de passe de la clé ("" si aucun)
# (GITHUB_TOKEN est fourni automatiquement.)
#
# macOS Intel (x86_64) est volontairement absent (runners GitHub rares/lents).
# Pour le rajouter : remettre une entrée matrix `macos-13` + target x86_64.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            stable: EVE-Tools-Suite-macOS-AppleSilicon.dmg
            find: "*.dmg"
          - platform: windows-latest
            target: ""
            args: ""
            stable: EVE-Tools-Suite-Windows-Setup.exe
            find: "*-setup.exe"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EVE Tools Suite ${{ github.ref_name }}"
          releaseBody: "Download the installer for your OS below. Once installed, the app auto-updates (cryptographically signed updates)."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Copie l'installeur sous un nom STABLE (sans version) et l'attache à la
      # release → les boutons du README peuvent pointer en permanence sur
      # `releases/latest/download/<nom stable>` (zéro maintenance par version).
      - name: Attach stable-named installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          # Workspace Cargo (crates/pbh-core) → la sortie va dans `target/` à la
          # racine, PAS `src-tauri/target/`. `-print -quit` = 1er match sans SIGPIPE.
          src=$(find target -type f -name "${{ matrix.find }}" -print -quit)
          if [ -z "$src" ]; then
            echo "::error::installer introuvable (${{ matrix.find }})"; find target -type f \( -name '*.dmg' -o -name '*-setup.exe' \) 2>/dev/null; exit 1
          fi
          echo "installer: $src → ${{ matrix.stable }}"
          cp "$src" "${{ matrix.stable }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.stable }}" --clobber --repo "$GITHUB_REPOSITORY"

  # Tous les builds OK → on publie le brouillon et on le marque « latest »
  # (sinon la release reste en draft et nécessite une publication manuelle).
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # Annonce la release sur Discord (embed propre). Le webhook est un SECRET
      # repo (`DISCORD_WEBHOOK`) — jamais en clair. Sans secret (forks), on skip.
      - name: Notify Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No DISCORD_WEBHOOK secret — skipping."; exit 0; fi
          notes=$(gh release view "$TAG" --repo "$REPO" --json body -q .body | head -c 1500)
          dl="https://github.com/$REPO/releases/latest/download"
          site="https://eve-tools-suite.com"
          payload=$(jq -n \
            --arg title "🚀 EVE Tools Suite $TAG" \
            --arg url "https://github.com/$REPO/releases/tag/$TAG" \
            --arg desc "$notes" \
            --arg win "[⬇ Windows (.exe)]($dl/EVE-Tools-Suite-Windows-Setup.exe)" \
            --arg mac "[⬇ macOS (.dmg)]($dl/EVE-Tools-Suite-macOS-AppleSilicon.dmg)" \
            --arg site "$site" \
            '{
              username: "EVE Tools Suite",
              avatar_url: ($site + "/cube.png"),
              embeds: [{
                title: $title, url: $url, description: $desc, color: 2854143,
                thumbnail: { url: ($site + "/cube.png") },
                fields: [
                  { name: "Download", value: ($win + "\n" + $mac) },
                  { name: "Links", value: ("[Website](" + $site + ") · [Changelog](" + $site + "#changelog)") }
                ],
                footer: { text: "Auto-updates if already installed" }
              }]
            }')
          code=$(curl -sS -o /dev/null -w "%{http_code}" -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK")
          echo "Discord webhook → HTTP $code"
          case "$code" in 2*) : ;; *) echo "::warning::Discord notify returned $code" ;; esac
